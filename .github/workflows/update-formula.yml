# The tap updates itself from discobox's public releases.
#
# The obvious design is the other way round: the release workflow pushes the
# formula here. That needs a token with write access to this repository stored
# in discobox-ai/discobox — a long-lived credential in another repo, to be
# rotated and to leak. Triggering a workflow here rather than pushing does not
# help: a cross-repo dispatch needs the same token.
#
# Pulling needs none. Reading a public repository's releases is unauthenticated,
# and writing here uses this repository's own GITHUB_TOKEN. The cost is that the
# formula lags a release by up to the interval below; workflow_dispatch is the
# button for when that is too long to wait.
name: Update formula

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.2

      # The generator lives in discobox so there is one copy of what a formula
      # should say, checked out here at the release being published.
      - uses: actions/checkout@v6.0.2
        with:
          repository: discobox-ai/discobox
          path: .discobox-src

      - name: Update to the latest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # Only a stable release. `brew install discobox` should give the
          # version people are meant to run, and this tap has one channel — an
          # alpha published under the same formula name would silently become
          # that. --exclude-pre-releases also skips drafts.
          tag=$(gh release list --repo discobox-ai/discobox \
                  --exclude-pre-releases --exclude-drafts --limit 1 \
                  --json tagName --jq '.[0].tagName // ""')
          if [ -z "$tag" ]; then
            echo "discobox has no stable release yet; nothing to serve"
            exit 0
          fi
          echo "latest stable release is $tag"

          mkdir -p Formula
          .discobox-src/scripts/brew-formula.sh "$tag" discobox-ai/discobox Formula/discobox.rb

          if git diff --quiet -- Formula/discobox.rb; then
            echo "the tap already serves $tag"
            exit 0
          fi
          git config user.name "discobox tap"
          git config user.email "noreply@discobox.ai"
          git add Formula/discobox.rb
          git commit -q -m "discobox $tag" \
            -m "Generated from the assets $tag uploaded, by the tap's own update workflow."
          git push
          echo "the tap now serves $tag"
